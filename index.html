<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Taskly - Organize sua rotina</title>

  <!-- Manifesto para PWA -->
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <meta name="theme-color" content="#1e1e1e">

  <!-- Firebase SDKs -->
  <script type="module" src="https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js"></script>
  <script type="module" src="https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js"></script>
  <script type="module" src="https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js"></script>
</head>
<body>
  <header class="topbar">
    <h1 class="logo">📘 Taskly</h1>
    <div class="controls">
      <input id="search" type="search" placeholder="Buscar matéria..." aria-label="Buscar tarefas">
      <button id="export-btn" class="icon-btn" title="Exportar tarefas">⬇︎</button>
      <input id="import-file" type="file" accept=".json" style="display:none;">
      <button id="import-btn" class="icon-btn" title="Importar tarefas">⬆︎</button>
      <button id="theme-toggle" class="icon-btn" title="Alternar tema">🌓</button>
      <button id="notify-perm" class="icon-btn" title="Permitir notificações">🔔</button>

      <!-- Área de autenticação -->
      <div id="auth-area" class="auth-area">
        <button id="login-btn" class="btn">Entrar com Google</button>
        <div id="user-info" style="display:none;">
          <img id="user-photo" src="" alt="user" class="user-photo">
          <span id="user-name"></span>
          <button id="logout-btn" class="icon-btn" title="Sair">🚪</button>
        </div>
      </div>
    </div>
  </header>

  <main>
    <!-- Tela inicial -->
    <section id="home" class="screen active">
      <h2>Bem-vindo ao Taskly</h2>
      <p>Gerencie suas tarefas e mantenha sua rotina organizada.</p>
      <button onclick="mostrarTela('add-task')" class="btn">Adicionar tarefa ➕</button>
      <button onclick="mostrarTela('agenda')" class="btn">Ver agenda 📅</button>
    </section>

    <!-- Adicionar tarefa -->
    <section id="add-task" class="screen">
      <h2>Nova Tarefa</h2>
      <form id="task-form">
        <label>Matéria</label>
        <input type="text" id="materia" required>

        <label>Cor</label>
        <input type="color" id="cor" value="#007bff">

        <label>Dia</label>
        <select id="dia" required>
          <option>Segunda-feira</option>
          <option>Terça-feira</option>
          <option>Quarta-feira</option>
          <option>Quinta-feira</option>
          <option>Sexta-feira</option>
        </select>

        <label>Hora</label>
        <input type="time" id="hora" required>

        <label>Lembrete (min antes)</label>
        <input type="number" id="lembrete" value="10" min="1">

        <button type="submit" class="btn">Salvar</button>
        <button type="button" onclick="mostrarTela('home')" class="btn secondary">Cancelar</button>
      </form>
    </section>

    <!-- Agenda -->
    <section id="agenda" class="screen">
      <h2>📅 Agenda</h2>
      <div id="agenda-container"></div>
      <button onclick="mostrarTela('home')" class="btn secondary">Voltar</button>
    </section>
  </main>

  <footer>
    <p>Feito com 💙</p>
  </footer>

  <script type="module" src="script.js"></script>
</body>
</html>
