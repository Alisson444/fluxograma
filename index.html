<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Taskly • App de Tarefas - Estudantes</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/3135/3135789.png" />
  <!-- PWA manifest (opcional) -->
  <link rel="manifest" href="manifest.json" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="https://cdn-icons-png.flaticon.com/512/3135/3135789.png" alt="logo" class="logo">
      <h1>Taskly</h1>
    </div>

    <div class="controls">
      <input id="search" type="search" placeholder="Buscar matéria..." aria-label="Buscar tarefas">
      <button id="export-btn" class="icon-btn" title="Exportar tarefas">⬇︎</button>
      <input id="import-file" type="file" accept=".json" style="display:none;">
      <button id="import-btn" class="icon-btn" title="Importar tarefas">⬆︎</button>
      <button id="theme-toggle" class="icon-btn" title="Alternar tema">🌓</button>
      <button id="notify-perm" class="icon-btn" title="Permitir notificações">🔔</button>
    </div>
  </header>

  <main class="main">
    <!-- MENU estilo app -->
    <nav class="bottom-menu">
      <button class="menu-btn" data-screen="home">🏠 Home</button>
      <button class="menu-btn" data-screen="adicionar-tarefa">➕ Nova</button>
      <button class="menu-btn" data-screen="agenda">📅 Agenda</button>
    </nav>

    <!-- HOME -->
    <section id="home" class="screen active">
      <div class="welcome card">
        <h2>Bem-vindo ao Taskly</h2>
        <p>Organize seus estudos. Use o botão <strong>➕ Nova</strong> para adicionar tarefas.</p>
        <div class="quick-actions">
          <button class="btn primary" onclick="mostrarTela('adicionar-tarefa')">➕ Nova Tarefa</button>
          <button class="btn" onclick="mostrarTela('agenda')">📅 Ver Agenda</button>
        </div>
      </div>

      <div class="stats card">
        <h3>Resumo</h3>
        <p id="stats-text">Carregando...</p>
      </div>
    </section>

    <!-- ADICIONAR TAREFA -->
    <section id="adicionar-tarefa" class="screen">
      <div class="card">
        <h2>Adicionar / Editar Tarefa</h2>
        <form id="task-form" class="form">
          <input type="hidden" id="task-index" value="-1">
          <label>Matéria
            <input id="materia" type="text" placeholder="Ex: Matemática" required>
          </label>

          <label>Cor (opcional)
            <input id="cor" type="color" value="#4CAF50">
          </label>

          <label>Dia da Semana
            <select id="dia" required>
              <option>Segunda-feira</option>
              <option>Terça-feira</option>
              <option>Quarta-feira</option>
              <option>Quinta-feira</option>
              <option>Sexta-feira</option>
              <option>Sábado</option>
              <option>Domingo</option>
            </select>
          </label>

          <label>Horário
            <input id="hora" type="time" required>
          </label>

          <label>Lembrete antes (min)
            <input id="lembrete-min" type="number" min="0" value="10">
          </label>

          <div class="form-actions">
            <button class="btn primary" type="submit">💾 Salvar</button>
            <button class="btn" type="button" onclick="resetForm()">Cancelar</button>
          </div>
        </form>
      </div>
    </section>

    <!-- AGENDA -->
    <section id="agenda" class="screen">
      <div class="card">
        <h2>Agenda Semanal</h2>
        <div id="agenda-container" class="agenda-container"></div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <small>© 2025 • Taskly • Feito por você</small>
  </footer>

  <template id="task-template">
    <li class="task-item">
      <div class="left">
        <input type="checkbox" class="complete-checkbox" />
        <div class="meta">
          <div class="mat-and-time"><span class="label-subject"></span><span class="label-time"></span></div>
          <div class="label-day"></div>
        </div>
      </div>
      <div class="right">
        <button class="icon-btn btn-edit" title="Editar">✏️</button>
        <button class="icon-btn btn-delete" title="Excluir">🗑️</button>
      </div>
    </li>
  </template>

  <script src="script.js"></script>
</body>
</html>
<!-- Adicione dentro do <head> --> 
<!-- (já existente: manifest, style, etc) -->
<script type="module" src="https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js"></script>
<script type="module" src="https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js"></script>
<script type="module" src="https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js"></script>

<!-- Dentro do header .controls (substitua ou acrescente estes elementos) -->
<div class="controls">
  <input id="search" type="search" placeholder="Buscar matéria..." aria-label="Buscar tarefas">
  <button id="export-btn" class="icon-btn" title="Exportar tarefas">⬇︎</button>
  <input id="import-file" type="file" accept=".json" style="display:none;">
  <button id="import-btn" class="icon-btn" title="Importar tarefas">⬆︎</button>
  <button id="theme-toggle" class="icon-btn" title="Alternar tema">🌓</button>
  <button id="notify-perm" class="icon-btn" title="Permitir notificações">🔔</button>

  <!-- NOVOS: Login / perfil -->
  <div id="auth-area" class="auth-area">
    <button id="login-btn" class="btn" title="Entrar com Google">Entrar</button>
    <div id="user-info" style="display:none;">
      <img id="user-photo" src="" alt="user" style="width:32px;height:32px;border-radius:8px;margin-left:8px;">
      <span id="user-name" style="margin-left:8px;"></span>
      <button id="logout-btn" class="icon-btn" title="Sair">🚪</button>
    </div>
  </div>
</div>
